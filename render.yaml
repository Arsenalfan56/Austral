services:
  - type: web
    name: austral
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn erp_austral.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: austral-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: austral-db
    plan: free
    databaseName: austral_db
    user: austral_user
