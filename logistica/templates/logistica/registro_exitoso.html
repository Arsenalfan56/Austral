{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Exitoso - Austral V&T</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #1a1f2e; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }
        .card { 
            background-color: #212529; 
            border-radius: 12px; 
            padding: 40px; 
            max-width: 500px; 
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .icono { 
            font-size: 5rem; 
            color: #4CAF50; 
            line-height: 1;
        }
        h2 { color: #4a7c9e; margin-top: 20px; }
        .btn-primary { 
            background-color: #4a7c9e; 
            border: none; 
            padding: 10px 25px; 
            font-weight: bold; 
            margin-top: 15px;
        }
        .btn-primary:hover { background-color: #3a6280; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icono">✅</div>
        <h2>¡Registro exitoso!</h2>
        <p class="text-muted mt-3">Tu cuenta ha sido creada correctamente en el sistema ERP de Austral V&T.</p>
        <p class="text-muted small">Se ha enviado un correo de confirmación con los datos de tu cuenta.</p>
        <a href="/admin/login/" class="btn btn-primary">Iniciar sesión</a>
    </div>
</body>
</html>
