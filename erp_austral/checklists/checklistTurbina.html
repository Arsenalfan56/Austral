<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Turbinas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; text-align: center; }
        .hidden { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="email"], input[type="text"], select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }
        .turbine-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 4px; margin-bottom: 15px; }
        .checkbox-group { margin: 10px 0; }
        .checkbox-group label { font-weight: normal; display: inline; margin-left: 5px; }
        .alert { background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <!-- SECCIÓN 1: LOGIN -->
    <div id="login-section">
        <h2>Acceso al Sistema de Monitoreo</h2>
        <div class="form-group">
            <label for="user-email">Correo Electrónico:</label>
            <input type="email" id="user-email" placeholder="ejemplo@empresa.com" required>
        </div>
        <button class="btn" onclick="login()">Ingresar al Checklist</button>
    </div>

    <!-- SECCIÓN 2: CHECKLIST (OCULTO AL INICIO) -->
    <div id="checklist-section" class="hidden">
        <h2>Checklist de Monitoreo Técnico</h2>
        
        <!-- Imagen de la Turbina -->
        <img src="turbina.webp" alt="Turbina Industrial" class="turbine-img">
        
        <div id="reset-alert" class="alert hidden">Los valores se han reiniciado. Por favor, actualice los datos actuales.</div>

        <form id="checklist-form" onsubmit="enviarChecklist(event)">
            <h3>Estado del Equipo</h3>
            <div class="form-group">
                <label for="estado">Estado Actual:</label>
                <select id="estado" required>
                    <option value="">Seleccione una opción...</option>
                    <option value="En Revisión">En Revisión 🛠️</option>
                    <option value="Listo para la Entrega">Listo para la Entrega ✅</option>
                </select>
            </div>

            <h3>Monitoreo de Parámetros</h3>
            
            <div class="checkbox-group">
                <input type="checkbox" id="p1" value="OK">
                <label for="p1">¿La temperatura de los cojinetes está en rango seguro?</label>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="p2" value="OK">
                <label for="p2">¿La presión del aceite de lubricación es estable?</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="p3" value="OK">
                <label for="p3">¿Los niveles de vibración global están bajo el límite?</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="p4" value="OK">
                <label for="p4">¿El sistema de sellado está libre de fugas?</label>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label for="observaciones">Observaciones adicionales:</label>
                <input type="text" id="observaciones" placeholder="Ninguna">
            </div>

            <button type="submit" class="btn" style="background-color: #28a745;">Guardar Registro</button>
        </form>
    </div>
</div>

<script>
    let usuarioEmail = "";
    // Apunta directamente a la dirección de tu backend en Node.js
    const API_URL = "http://localhost:3000"; 

    function login() {
        const emailInput = document.getElementById('user-email').value;
        if (!emailInput || !emailInput.includes('@')) {
            alert('Por favor ingrese un correo electrónico válido.');
            return;
        }
        usuarioEmail = emailInput;

        // Conexión corregida agregando la dirección del servidor
        fetch(`${API_URL}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: usuarioEmail })
        })
        .then(res => {
            if (!res.ok) throw new Error('Error en el servidor');
            return res.json();
        })
        .then(data => {
            // Muestra la sección oculta del checklist si el registro es exitoso
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('checklist-section').classList.remove('hidden');
            verificarEstadoFormulario();
            
            // Revisa el estado cada 5 segundos
            setInterval(verificarEstadoFormulario, 5000);
        })
        .catch(err => {
            console.error("Error al iniciar sesión:", err);
            alert("No se pudo conectar con el servidor. Verifica que 'node server.js' esté activo en la terminal.");
        });
    }

    function enviarChecklist(event) {
        event.preventDefault();
        const datos = {
            email: usuarioEmail,
            estado: document.getElementById('estado').value,
            p1: document.getElementById('p1').checked,
            p2: document.getElementById('p2').checked,
            p3: document.getElementById('p3').checked,
            p4: document.getElementById('p4').checked,
            observaciones: document.getElementById('observaciones').value
        };

        // Conexión corregida agregando la dirección del servidor
        fetch(`${API_URL}/api/checklist`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(res => {
            if (!res.ok) throw new Error('Error al guardar');
            return res.json();
        })
        .then(data => {
            alert('Checklist guardado con éxito. Se reiniciará en 1 hora.');
            document.getElementById('reset-alert').classList.add('hidden');
        })
        .catch(err => {
            console.error("Error al enviar el checklist:", err);
            alert("Error al intentar guardar el registro en el servidor.");
        });
    }

    function verificarEstadoFormulario() {
        // Conexión corregida agregando la dirección del servidor
        fetch(`${API_URL}/api/status`)
        .then(res => {
            if (!res.ok) throw new Error('Error de estado');
            return res.json();
        })
        .then(data => {
            if (data.reinstalado) {
                document.getElementById('checklist-form').reset();
                document.getElementById('reset-alert').classList.remove('hidden');
            }
        })
        .catch(err => console.log("Monitoreo de estado esperando actualización..."));
    }
</script>
</body>
</html>
